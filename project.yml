name: TalkPulse
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
targets:
  TalkPulse:
    type: application
    platform: macOS
    sources:
      - Shared
      - TalkPulse
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.talkpulse
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.9"
      ENABLE_HARDENED_RUNTIME: "YES"
      GENERATE_INFOPLIST_FILE: "NO"
      APP_GROUP_IDENTIFIER: group.com.example.talkpulse
    info:
      path: TalkPulse/Info.plist
      properties:
        TalkPulseAppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
    entitlements:
      path: TalkPulse/TalkPulse.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    dependencies:
      - target: TalkPulseWidgetExtension
        embed: true

  # NOTE: We use `type: bundle` here because XcodeGen does not support
  # `appExtension` on macOS. After generation, setup.sh patches the
  # .pbxproj to change the product type and embed location.
  TalkPulseWidgetExtension:
    type: bundle
    platform: macOS
    sources:
      - Shared
      - TalkPulseWidget
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.talkpulse.widget
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.9"
      ENABLE_HARDENED_RUNTIME: "YES"
      APP_GROUP_IDENTIFIER: group.com.example.talkpulse
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    info:
      path: TalkPulseWidget/Info.plist
      properties:
        CFBundleDisplayName: TalkPulse
        TalkPulseAppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TalkPulseWidget/TalkPulseWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
